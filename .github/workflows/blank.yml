name: Close Stale Issues

on:
  schedule:
    - cron: '0 12 * * *' # 每天台灣時間晚上8點
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: '這個 issue 已經有一段時間沒有活動了，將會被自動關閉。'
          days-before-stale: 30
          days-before-close: 7
          only-issues: true
